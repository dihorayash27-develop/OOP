		<script>
			
			function vov()
			{
				var txt = document.getElementById("txt1").value;
				document.getElementById("disp").innerHTML = '';
				for(let i=0; i<txt.length; i++)
				{
					if(txt[i] == 'A' || txt[i] == 'a' || txt[i] == 'E' || txt[i] == 'e' || txt[i] == 'I' || txt[i] == 'i' ||txt[i] == 'O' ||txt[i] == 'o' ||txt[i] == 'U' ||txt[i] == 'u')
					{
						document.getElementById("disp").innerHTML = document.getElementById("disp").innerHTML + txt[i];
					}
				}
				
			}
			
			function clr()
			{
				document.getElementById("disp").innerHTML = '';
			}
			
			function spchar()
			{
				var txt = document.getElementById("txt1").value;
				document.getElementById("disp").innerHTML = '';
				for(let i=0; i<txt.length; i++)

					if(txt[i] == '~' || txt[i] == '`' || txt[i] == '!' || txt[i] == '@' || txt[i] == '#' || txt[i] == '$' ||txt[i] == '^' ||txt[i] == '&' ||txt[i] == '(' ||txt[i] == ')'|| txt[i] == '_' ||txt[i] == '[' ||txt[i] == ']' ||txt[i] == '{' ||txt[i] == '}' ||txt[i] == '|' ||txt[i] == '?' ||txt[i] == ':' ||txt[i] == ';' ||txt[i] == '"' ||txt[i] == '<' ||txt[i] == '>' ||txt[i] == ',' ||txt[i] == '.')

			}
			
			function num()

				document.getElementById("disp").innerHTML = '';
				for(let i=0; i<txt.length; i++)

					if(txt[i] == '1'| txt[i] == '2' || txt[i] == '3' || txt[i] == '4' || txt[i] == '5' || txt[i] == '6' ||txt[i] == '7' ||txt[i] == '8' ||txt[i] == '9')
					{
						document.getElementById("disp").innerHTML = document.getElementById("disp").innerHTML + txt[i];
						x++;
					}
				}
				alert(" No Of Number : " + x);
			}
			
			function zer()

				var x=0;
				document.getElementById("disp").innerHTML = '';
				for(let i=0; i<txt.length; i++)
				{
					if(txt[i] == '0')
					{
							x++;
					}
				}
				document.getElementById("disp").innerHTML=" No Of Zero : " + x;
			}

				{
					if(txt[i] == ' ')

							x++;
					}
				}
				document.getElementById("disp").innerHTML=" No Of Space : " + x;
			}
